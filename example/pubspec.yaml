name: example
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  fabric:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: ./fonts/static/Inter-ExtraLight.ttf
          weight: 200
        - asset: ./fonts/static/Inter-Light.ttf
          weight: 300
        - asset: ./fonts/static/Inter-Regular.ttf
          weight: 400
        - asset: ./fonts/static/Inter-Medium.ttf
          weight: 500
        - asset: ./fonts/static/Inter-SemiBold.ttf
          weight: 600
        - asset: ./fonts/static/Inter-Bold.ttf
          weight: 700
        - asset: ./fonts/static/Inter-ExtraBold.ttf
          weight: 800
    - family: BricolageGrotesque
      fonts:
        - asset: ./fonts/static/BricolageGrotesque-ExtraLight.ttf
          weight: 200
        - asset: ./fonts/static/BricolageGrotesque-Light.ttf
          weight: 300
        - asset: ./fonts/static/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: ./fonts/static/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: ./fonts/static/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: ./fonts/static/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: ./fonts/static/BricolageGrotesque-ExtraBold.ttf
          weight: 800
